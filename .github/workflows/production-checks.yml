name: Production checks

on:
  push:
    branches: [main, production-foundation]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies (tests load webhook-server/index.js)
        run: npm ci --prefix webhook-server
      - run: npm test

  # Firestore security rules against the real Firestore emulator (needs Java).
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Firestore rules tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules.out || status=$?
          # Surface failures as annotations so they're readable from the checks API.
          grep -E "not ok|Error|error:|expected|PERMISSION|✖" rules.out | head -40 | sed 's/^/::error::/' || true
          exit ${status:-0}
